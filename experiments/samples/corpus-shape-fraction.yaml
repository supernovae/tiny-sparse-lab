plan_version: 1
id: corpus-shape-fraction-sample-v5
base_run: configs/runtime_smoke_cpu.yaml
evaluation_suite: heldout-suite.yaml
corpus_variants:
  - id: raw
    project: corpora/devmind-sample-v0/corpus.yaml
    vocab_size: 300
    view: chat
    release_set:
      include_shapes: [raw_document, troubleshooting_scenario]
  - id: shaped
    project: corpora/devmind-sample-v0/corpus.yaml
    vocab_size: 300
    view: chat
    release_set:
      include_shapes: [raw_document, troubleshooting_scenario, tool_trace]
  - id: full
    project: corpora/devmind-sample-v0/corpus.yaml
    vocab_size: 300
  - id: fractional
    project: corpora/devmind-sample-v0/corpus.yaml
    vocab_size: 300
    release_set:
      fraction:
        generated_share: 0.5640625
        train_tokens: 640
        tokenizer_path: pinned/fraction-tokenizer.json
        tokenizer_sha256: 85446740106a333f3090d11e896f851ad5bdbe551609ef470117fb32b95612a4
axes:
  - name: corpus
    choices:
      - label: raw
        set: {inputs.corpus_variant: raw}
      - label: shaped
        set: {inputs.corpus_variant: shaped}
      - label: full
        set: {inputs.corpus_variant: full}
      - label: fractional
        set: {inputs.corpus_variant: fractional}
comparisons:
  - id: training-shape
    baseline: {corpus: raw}
    variant: {corpus: shaped}
    mode: multi_factor
    confounders: [tokenizer, train_document_count, train_token_count]
    interventions:
      - artifacts.corpus_export.identifier
      - artifacts.corpus_export.sha256
      - artifacts.corpus_release.identifier
      - artifacts.corpus_release.sha256
      - artifacts.prepared_data.identifier
      - artifacts.prepared_data.sha256
      - artifacts.tokenizer.sha256
      - dataset.revision
      - dataset.train_max_documents
      - dataset.train_max_tokens
      - dataset.validation_max_documents
      - dataset.validation_max_tokens
    invariants: [training.max_tokens, training.seq_len, model.vocab_size, optimizer.peak, runtime.backend, seed]
  - id: exact-generated-fraction
    baseline: {corpus: full}
    variant: {corpus: fractional}
    mode: multi_factor
    confounders: [tokenizer, train_document_count, available_train_tokens]
    interventions:
      - artifacts.corpus_export.identifier
      - artifacts.corpus_export.sha256
      - artifacts.corpus_release.identifier
      - artifacts.corpus_release.sha256
      - artifacts.prepared_data.identifier
      - artifacts.prepared_data.sha256
      - artifacts.tokenizer.sha256
      - dataset.revision
      - dataset.train_max_documents
      - dataset.train_max_tokens
    invariants: [training.max_tokens, training.seq_len, model.vocab_size, optimizer.peak, runtime.backend, seed]
execution:
  backend: cpu
