[project]
name = "tiny-sparse-lab"
version = "0.1.0"
description = "An educational dense-transformer laboratory"
readme = "README.md"
authors = [
    { name = "Byron Miller (MOBB)", email = "bymiller@redhat.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "datasets>=4,<5",
    "huggingface-hub>=0.34,<2",
    "numpy>=2,<3",
    "plotly>=6,<7",
    "psutil>=7,<8",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "streamlit>=1.64,<2",
    "tokenizers==0.22.2",
    "triton==3.8.0+git4cff872c.rocm10.0.0; sys_platform == 'linux'",
    "amd-torch-device-gfx1100==2.13.0+rocm10.0.0; sys_platform == 'linux'",
    "amd-torch-device-gfx110x==2.13.0+rocm10.0.0; sys_platform == 'linux'",
    "torch[device-gfx1100]==2.13.0+rocm10.0.0; sys_platform == 'linux'",
    "rocm[libraries]==10.0.0; sys_platform == 'linux'",
    "torch>=2.8,<3; sys_platform != 'linux'",
    "pyarrow>=25,<26",
    "safetensors>=0.5,<1",
]

[project.scripts]
sparselab = "sparselab.cli.main:main"

[project.optional-dependencies]
mlx = [
    "mlx==0.32.2",
]
reference = [
    "transformers>=4.45,<5",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sparselab"

[[tool.uv.index]]
name = "rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"
explicit = true

[[tool.uv.index]]
name = "rocm-core"
url = "https://stable.repo.amd.com/rocm/core/whl-next/"

[tool.uv.sources]
torch = [{ index = "rocm", marker = "sys_platform == 'linux'" }]
rocm = { index = "rocm-core", marker = "sys_platform == 'linux'" }
triton = { index = "rocm", marker = "sys_platform == 'linux'" }
amd-torch-device-gfx1100 = { index = "rocm", marker = "sys_platform == 'linux'" }
amd-torch-device-gfx110x = { index = "rocm", marker = "sys_platform == 'linux'" }

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
markers = [
    "mps: requires actual Apple MPS hardware",
    "cuda: requires actual NVIDIA CUDA hardware",
    "rocm: requires actual AMD ROCm hardware",
    "xpu: requires actual Intel XPU hardware",
    "mlx: requires the optional Apple MLX runtime and Metal hardware",
    "network: requires external network access",
]
