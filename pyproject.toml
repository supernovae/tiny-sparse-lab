[project]
name = "tiny-sparse-lab"
version = "0.1.0"
description = "An educational dense-transformer laboratory"
readme = "README.md"
authors = [
    { name = "Byron Miller (MOBB)", email = "bymiller@redhat.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "datasets>=4,<5",
    "huggingface-hub>=0.34,<2",
    "numpy>=2,<3",
    "plotly>=6,<7",
    "psutil>=7,<8",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "streamlit>=1.64,<2",
    "tokenizers==0.22.2",
    "pyarrow>=25,<26",
    "safetensors>=0.5,<1",
]

[project.scripts]
sparselab = "sparselab.cli.entry:main"

[project.optional-dependencies]
cpu = [
    "torch>=2.8,<3",
]
mlx = [
    "mlx==0.32.2",
]
reference = [
    "transformers>=4.45,<5",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sparselab"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-xdist>=3,<4",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
markers = [
    "mps: requires actual Apple MPS hardware",
    "cuda: requires actual NVIDIA CUDA hardware",
    "rocm: requires actual AMD ROCm hardware",
    "xpu: requires actual Intel XPU hardware",
    "mlx: requires the optional Apple MLX runtime and Metal hardware",
    "network: requires external network access",
]
