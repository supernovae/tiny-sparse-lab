id: devmind_scenarios_deployment
version: '1'
kind: deterministic_scenarios
parameters:
  generator: deployment_change_v1
  seed_ranges:
    - {start: 0, end: 799, scenario_family: deployment_train, template_family: deployment_template_train}
    - {start: 800, end: 899, scenario_family: deployment_validation, template_family: deployment_template_validation}
    - {start: 900, end: 999, scenario_family: deployment_test, template_family: deployment_template_test}
inputs: [deployment_worlds]
