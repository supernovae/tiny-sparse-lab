id: devmind_scenarios_platform
version: '1'
kind: deterministic_scenarios
parameters:
  generator: platform_fault_v1
  seed_ranges:
    - {start: 0, end: 799, scenario_family: platform_train, template_family: platform_template_train}
    - {start: 800, end: 899, scenario_family: platform_validation, template_family: platform_template_validation}
    - {start: 900, end: 999, scenario_family: platform_test, template_family: platform_template_test}
inputs: [platform_worlds]
