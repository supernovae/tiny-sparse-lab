id: devmind_scenarios_filesystem
version: '1'
kind: deterministic_scenarios
parameters:
  generator: filesystem_judgment_v1
  seed_ranges:
    - {start: 0, end: 799, scenario_family: filesystem_train, template_family: filesystem_template_train}
    - {start: 800, end: 899, scenario_family: filesystem_validation, template_family: filesystem_template_validation}
    - {start: 900, end: 999, scenario_family: filesystem_test, template_family: filesystem_template_test}
inputs: [filesystem_worlds]
