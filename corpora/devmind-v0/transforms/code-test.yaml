id: devmind_scenarios_code_test
version: '1'
kind: deterministic_scenarios
parameters:
  generator: code_test_workflow_v1
  seed_ranges:
    - {start: 0, end: 799, scenario_family: code_test_train, template_family: code_test_template_train}
    - {start: 800, end: 899, scenario_family: code_test_validation, template_family: code_test_template_validation}
    - {start: 900, end: 999, scenario_family: code_test_test, template_family: code_test_template_test}
inputs: [code_test_worlds]
