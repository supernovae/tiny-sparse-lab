id: devmind_v1_scenarios_deployment
version: '2'
kind: deterministic_scenarios
parameters:
  generator: deployment_change_v2
  seed_ranges:
    - {start: 0, end: 799, scenario_family: deployment_train, template_family: deployment_template_train_v2}
    - {start: 800, end: 899, scenario_family: deployment_validation, template_family: deployment_template_validation_v2}
    - {start: 900, end: 999, scenario_family: deployment_test, template_family: deployment_template_test_v2}
inputs: [deployment_worlds]
