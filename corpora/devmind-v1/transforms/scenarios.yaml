id: devmind_v1_scenarios_filesystem
version: '2'
kind: deterministic_scenarios
parameters:
  generator: filesystem_judgment_v2
  seed_ranges:
    - {start: 0, end: 799, scenario_family: filesystem_train, template_family: filesystem_template_train_v2}
    - {start: 800, end: 899, scenario_family: filesystem_validation, template_family: filesystem_template_validation_v2}
    - {start: 900, end: 999, scenario_family: filesystem_test, template_family: filesystem_template_test_v2}
inputs: [filesystem_worlds]
