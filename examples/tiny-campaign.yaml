campaign_version: 1
id: tiny-campaign
stages:
- id: corpus
  kind: corpus_release
  scope: corpus
  project: tiny-campaign/corpus.yaml
- id: readiness
  kind: corpus_readiness
  scope: corpus
  requires:
  - corpus
  corpus: corpus
  policy:
    min_unique_train_bytes_by_domain:
      technical_docs: 100
      developer: 100
    required_nonzero_languages:
    - en
    required_nonzero_shapes:
    - raw_document
    min_heldout_families: 1
- id: corpus-approval
  kind: approval
  scope: release
  requires:
  - readiness
  bind:
  - corpus
  - readiness
