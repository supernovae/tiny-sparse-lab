schema_version: 1
name: contract-fixture
seed: 7
device: cpu
model:
  vocab_size: 512
  hidden_dim: 16
  num_layers: 1
  num_heads: 2
  ffn_dim: 32
  max_seq_len: 32
tokenizer:
  path: artifacts/tokenizer.json
dataset:
  source: synthetic
  cache_dir: artifacts/data
  train_max_documents: 8
  validation_max_documents: 4
  train_max_tokens: 129
  validation_max_tokens: 81
  synthetic_seed: 7
training:
  batch_size: 1
  seq_len: 16
  max_steps: 20
  max_tokens: 640
  grad_clip_norm: 1.0
  deterministic: true
optimizer:
  learning_rate: 0.003
  min_learning_rate: 0.0003
  warmup_steps: 2
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-08
attention:
  kind: dense
evaluation:
  every_steps: 5
  max_batches: 4
logging:
  root_dir: runs
  every_steps: 1
  architecture_diagnostics: scalar
  checkpoint_every_steps: 10
