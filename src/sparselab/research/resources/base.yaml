schema_version: 2
name: research-base
seed: 17
model:
  vocab_size: 512
  hidden_dim: 64
  num_layers: 2
  num_heads: 4
  ffn_dim: 256
  max_seq_len: 256
  rms_norm_eps: 1.0e-6
  tie_embeddings: true
  ffn: dense
  num_experts: 1
  experts_per_token: 1
  shared_expert: false
  router_aux_loss_coefficient: 0.0
  memory: none
  memory_injection: final
  memory_table_size: 0
  memory_ngram_size: 0
  memory_dim: 0
  memory_package_path: null
  memory_ngram_orders: []
  memory_hash_heads: 1
attention:
  kind: dense
  rope_base: 10000.0
  window_size: null
  latent_dim: null
  block_size: null
  selected_blocks: null
tokenizer:
  path: artifacts/tokenizer/tokenizer.json
dataset:
  source: chat_recall
  revision: null
  dataset_config: null
  cache_dir: artifacts/data
  train_max_documents: 768
  validation_max_documents: 12
  train_max_tokens: 131072
  validation_max_tokens: 4096
  synthetic_seed: 42
  train_path: null
  validation_path: null
  license: null
training:
  seq_len: 64
  max_steps: 32
  max_tokens: 4096
  grad_clip_norm: 1.0
  deterministic: true
  micro_batch_size: 2
  gradient_accumulation: 1
optimizer:
  name: adamw
  peak: 0.003
  floor: 0.0003
  warmup_steps: 4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  state_offload: false
evaluation:
  every_steps: 8
  max_batches: 6
checkpoint:
  every_steps: 8
  every_tokens: null
  every_minutes: null
  keep_periodic: true
logging:
  root_dir: runs
  every_steps: 1
  architecture_diagnostics: scalar
runtime:
  engine: pytorch
  backend: cpu
  device_index: 0
  precision: fp32
  memory:
    policy: balanced
    max_device_memory_fraction: 0.9
    budget_bytes: null
    activation_checkpointing:
      enabled: false
      strategy: transformer_block
    activation_offload:
      enabled: false
    allowed_sequence_lengths: []
    allowed_optimizers: []
staging:
  smoke_steps: 2
  warmup_steps: 5
