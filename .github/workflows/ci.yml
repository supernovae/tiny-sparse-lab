name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: check .
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: format --check .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - run: uv run pytest -m "not mps and not network"
      - run: uv run sparselab --help
      - run: uv run sparselab inspect configs/micro_dense.yaml --json
  test-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev --extra mlx
      - run: uv run pytest -m "not mps and not network"
      - run: uv run sparselab --help
      - run: uv run sparselab inspect configs/micro_dense.yaml --json
