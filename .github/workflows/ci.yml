name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: check .
      - name: Verify frozen decoding test identity
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          frozen = json.loads(Path("experiments/research/dense-lm-decoding-v1/preregistration.json").read_text())
          test = Path("tests/test_generation.py")
          expected = frozen["frozen_sha256"][test.as_posix()]
          actual = hashlib.sha256(test.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"{test}: frozen preregistration digest changed")
          PY
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: format --check .
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Focused configuration, corpus, and ingestion checks
        run: >-
          uv run --locked pytest -q
          tests/test_config.py
          tests/test_conversations.py
          tests/test_corpus_acquisition.py
          tests/test_corpus_pipeline.py
          tests/test_hf_auth.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - name: Full CPU suite (Linux)
        run: >-
          uv run --locked pytest -q -n 2 --dist loadfile
          -m "not mps and not mlx and not cuda and not rocm and not xpu and not network"
      - run: uv run --locked sparselab --help
      - run: uv run --locked sparselab inspect configs/micro_dense.yaml --json
  test-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - name: Full CPU suite (macOS)
        run: >-
          uv run --locked pytest -q -n 2 --dist loadfile
          -m "not mps and not mlx and not cuda and not rocm and not xpu and not network"
      - run: uv run --locked sparselab --help
      - run: uv run --locked sparselab inspect configs/micro_dense.yaml --json
