name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: "Manual scope; model suites require a separate reviewed allocation"
        type: choice
        options: [safe, fast, integration-linux, platform-macos, release-candidate]
        default: safe

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  CUDA_VISIBLE_DEVICES: ""
  HIP_VISIBLE_DEVICES: ""
  ROCR_VISIBLE_DEVICES: ""
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  safe:
    # Fast static checks and core config/authority sanity checks.
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'safe'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Static format and research records
        env:
          UV_OFFLINE: "1"
        run: |
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync ruff format --check .
          uv run --locked --no-sync python -m sparselab.research.lint --json
      - name: Core config and verifier authority sanity
        env:
          UV_OFFLINE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SPARSELAB_WORK_DIR: ${{ runner.temp }}/pr-safe-work
        run: |
          uv run --locked --no-sync pytest -q -n 0 -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/pr-safe-pytest" \
            tests/test_verifier_authority_current.py \
            tests/test_slow_list.py \
            tests/test_research_lint.py \
            tests/test_config.py \
            tests/test_first_model_config.py \
            tests/test_instruction_config.py

  lab-loop:
    # Outcome validation (CPU): build, train, checkpoint, resume, try, probe,
    # explore, and generate from real models within a fast iteration budget.
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'safe'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Model build, training, lab loop, probes, explorer, and generation
        env:
          UV_OFFLINE: "1"
          SPARSELAB_WORK_DIR: ${{ runner.temp }}/lab-loop-work
          SPARSELAB_LAB_LOOP_BUDGET_SECONDS: "300"
        run: |
          uv run --locked --no-sync pytest -q -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/lab-loop-pytest" \
            -n auto --maxprocesses=4 --dist loadfile \
            -m "not slow and not mps and not mlx and not cuda and not rocm and not xpu and not network" \
            tests/test_language_model.py \
            tests/test_dense_sdpa.py \
            tests/test_sparse_attention.py \
            tests/test_sliding_attention.py \
            tests/test_latent_attention.py \
            tests/test_moe.py \
            tests/test_memory.py \
            tests/test_combined.py \
            tests/test_training.py \
            tests/test_gradient_accumulation.py \
            tests/test_checkpoints.py \
            tests/test_lab_mode.py \
            tests/test_probes.py \
            tests/test_eval_integrity.py \
            tests/test_references.py \
            tests/test_explorer.py \
            tests/test_generation.py \
            tests/test_inference.py

  fast:
    # Remaining fast CPU suite (excluding slow tests and modules already run in
    # safe and lab-loop so checks are not duplicated across jobs).
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Fast CPU suite (not slow)
        env:
          UV_OFFLINE: "1"
          SPARSELAB_WORK_DIR: ${{ runner.temp }}/fast-work
        run: >-
          uv run --locked --no-sync pytest -q -p no:cacheprovider
          --basetemp "$RUNNER_TEMP/fast-pytest"
          -n auto --maxprocesses=4
          --dist loadfile --durations=25
          --ignore=tests/test_verifier_authority_current.py
          --ignore=tests/test_slow_list.py
          --ignore=tests/test_research_lint.py
          --ignore=tests/test_config.py
          --ignore=tests/test_first_model_config.py
          --ignore=tests/test_instruction_config.py
          --ignore=tests/test_language_model.py
          --ignore=tests/test_dense_sdpa.py
          --ignore=tests/test_sparse_attention.py
          --ignore=tests/test_sliding_attention.py
          --ignore=tests/test_latent_attention.py
          --ignore=tests/test_moe.py
          --ignore=tests/test_memory.py
          --ignore=tests/test_combined.py
          --ignore=tests/test_training.py
          --ignore=tests/test_gradient_accumulation.py
          --ignore=tests/test_checkpoints.py
          --ignore=tests/test_lab_mode.py
          --ignore=tests/test_probes.py
          --ignore=tests/test_eval_integrity.py
          --ignore=tests/test_references.py
          --ignore=tests/test_explorer.py
          --ignore=tests/test_generation.py
          --ignore=tests/test_inference.py
          -m "not slow and not mps and not mlx and not cuda and not rocm and not xpu and not network"
  integration-linux:
    # Model work is manual-only. Dispatch requires its own reviewed allocation.
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'integration-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Manual optimizer and generation integration
        run: >-
          uv run --locked --extra cpu pytest -q -n 0
          tests/test_training.py tests/test_generation.py
          tests/test_generation_panel.py tests/test_serving.py

  platform-macos:
    # Platform model behavior is not inferred from the Linux PR checks.
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'platform-macos'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Manual macOS optimizer and generation integration
        run: >-
          uv run --locked --extra cpu pytest -q -n 0
          tests/test_training.py tests/test_generation.py
          tests/test_generation_panel.py tests/test_serving.py

  release-candidate:
    # Broad suites are available only through explicit manual selection.
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'release-candidate'
    name: Full CPU suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Manual release-candidate CPU suite
        run: >-
          uv run --locked --extra cpu pytest -q -n auto --maxprocesses=4
          --dist worksteal --durations=25
          -m "not mps and not mlx and not cuda and not rocm and not xpu and not network"
      - run: uv run --locked --extra cpu sparselab --help
      - run: uv run --locked --extra cpu sparselab inspect configs/micro_dense.yaml --json
