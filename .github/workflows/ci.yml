name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
  workflow_dispatch:
    inputs:
      serving_only:
        description: "Run bounded serving checks without the full CPU suites"
        type: boolean
        default: false
      qualification_sha:
        description: "Exact reviewed commit for a serving-only KML dispatch"
        type: string
        required: false

# PR updates replace obsolete work; main remains covered after merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# Tiny CPU fixtures benefit from parallel pytest workers, not nested BLAS pools.
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  # Pin supported images: Linux x64 and macOS arm64 CPU coverage.
  # https://github.com/actions/runner-images#available-images
  lint:
    # Only this same-repo draft integration branch uses the separate KML lane.
    # ready_for_review has draft=false and returns to the normal PR checks.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft != true ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.head.ref != 'codex/kernel-memory-lab' ||
      github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.serving_only && inputs.qualification_sha || '' }}
      - name: Start bounded qualification watcher
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        env:
          KML_CI_GITHUB_TOKEN: ${{ github.token }}
          KML_CI_EXPECTED_SHA: ${{ inputs.qualification_sha }}
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --start-watch
          --expected-sha "$KML_CI_EXPECTED_SHA"
          --root "$RUNNER_TEMP/kml-ci-lint"
      - uses: astral-sh/setup-uv@v10.2.0
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        with:
          version: "0.12.19"
          enable-cache: false
      - uses: actions/setup-python@v7
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        with:
          python-version: "3.14"
      - name: Run bounded qualification lint
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        env:
          KML_CI_GITHUB_TOKEN: ${{ github.token }}
          KML_CI_EXPECTED_SHA: ${{ inputs.qualification_sha }}
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --job lint
          --expected-sha "$KML_CI_EXPECTED_SHA"
          --root "$RUNNER_TEMP/kml-ci-lint"
      - name: Finalize qualification watcher
        if: always() && github.event_name == 'workflow_dispatch' && inputs.serving_only
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --stop-watch
          --root "$RUNNER_TEMP/kml-ci-lint"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.serving_only
        with:
          name: kml-ci-lint-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kml-ci-lint/*.json
            ${{ runner.temp }}/kml-ci-lint/*.log
            ${{ runner.temp }}/kml-ci-lint/*.sqlite*
            ${{ runner.temp }}/kml-ci-lint/events/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: astral-sh/ruff-action@v4.1.0
        if: github.event_name != 'workflow_dispatch' || !inputs.serving_only
        with:
          version: "0.16.8"
          args: check .
      - name: Verify frozen decoding test identity
        if: github.event_name != 'workflow_dispatch' || !inputs.serving_only
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          frozen = json.loads(Path("experiments/research/dense-lm-decoding-v1/preregistration.json").read_text())
          test = Path("tests/test_generation.py")
          expected = frozen["frozen_sha256"][test.as_posix()]
          actual = hashlib.sha256(test.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"{test}: frozen preregistration digest changed")
          PY
      - uses: astral-sh/ruff-action@v4.1.0
        if: github.event_name != 'workflow_dispatch' || !inputs.serving_only
        with:
          version: "0.16.8"
          args: format --check .
  fast:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft != true ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.head.ref != 'codex/kernel-memory-lab' ||
      github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.serving_only && inputs.qualification_sha || '' }}
      - name: Start bounded qualification watcher
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        env:
          KML_CI_GITHUB_TOKEN: ${{ github.token }}
          KML_CI_EXPECTED_SHA: ${{ inputs.qualification_sha }}
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --start-watch
          --expected-sha "$KML_CI_EXPECTED_SHA"
          --root "$RUNNER_TEMP/kml-ci-fast"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.serving_only }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Lint tracked research declarations and evidence references
        if: github.event_name != 'workflow_dispatch' || !inputs.serving_only
        run: uv run --locked --extra cpu python -m sparselab.research.lint --json
      - name: Focused configuration, corpus, and ingestion checks
        if: github.event_name != 'workflow_dispatch' || !inputs.serving_only
        run: >-
          uv run --locked --extra cpu pytest -q
          tests/test_research_lint.py
          tests/test_corpus_identity.py
          tests/test_config.py
          tests/test_conversations.py
          tests/test_corpus_acquisition.py
          tests/test_corpus_pipeline.py
          tests/test_hf_auth.py
          tests/test_attempt_budget.py
          tests/test_operational_monitor.py
          tests/test_kml_card04_profile_tools.py
      - name: Run bounded qualification fast checks
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        env:
          KML_CI_GITHUB_TOKEN: ${{ github.token }}
          KML_CI_EXPECTED_SHA: ${{ inputs.qualification_sha }}
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --job fast
          --expected-sha "$KML_CI_EXPECTED_SHA"
          --root "$RUNNER_TEMP/kml-ci-fast"
      - name: Finalize qualification watcher
        if: always() && github.event_name == 'workflow_dispatch' && inputs.serving_only
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --stop-watch
          --root "$RUNNER_TEMP/kml-ci-fast"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.serving_only
        with:
          name: kml-ci-fast-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kml-ci-fast/*.json
            ${{ runner.temp }}/kml-ci-fast/*.log
            ${{ runner.temp }}/kml-ci-fast/*.sqlite*
            ${{ runner.temp }}/kml-ci-fast/events/*.json
          if-no-files-found: error
          retention-days: 7
  evidence-macos-arm64:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft != true ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.head.ref != 'codex/kernel-memory-lab' ||
      github.event.pull_request.base.ref != 'main'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.serving_only && inputs.qualification_sha || '' }}
      - name: Start bounded qualification watcher
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        env:
          KML_CI_GITHUB_TOKEN: ${{ github.token }}
          KML_CI_EXPECTED_SHA: ${{ inputs.qualification_sha }}
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --start-watch
          --expected-sha "$KML_CI_EXPECTED_SHA"
          --root "$RUNNER_TEMP/kml-ci-archive"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.serving_only }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Offline research lint and corpus archive acceptance (macOS)
        if: github.event_name != 'workflow_dispatch' || !inputs.serving_only
        run: |
          uv run --locked --extra cpu python -m sparselab.research.lint --json
          uv run --locked --extra cpu pytest -q \
            tests/test_research_lint.py tests/test_declaration_preflight.py \
            tests/test_corpus_pipeline.py tests/test_corpus_identity.py tests/test_archive.py
      - name: Run bounded qualification archive checks
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        env:
          KML_CI_GITHUB_TOKEN: ${{ github.token }}
          KML_CI_EXPECTED_SHA: ${{ inputs.qualification_sha }}
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --job archive
          --expected-sha "$KML_CI_EXPECTED_SHA"
          --root "$RUNNER_TEMP/kml-ci-archive"
      - name: Finalize qualification watcher
        if: always() && github.event_name == 'workflow_dispatch' && inputs.serving_only
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --stop-watch
          --root "$RUNNER_TEMP/kml-ci-archive"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.serving_only
        with:
          name: kml-ci-archive-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kml-ci-archive/*.json
            ${{ runner.temp }}/kml-ci-archive/*.log
            ${{ runner.temp }}/kml-ci-archive/*.sqlite*
            ${{ runner.temp }}/kml-ci-archive/events/*.json
          if-no-files-found: error
          retention-days: 7
  serving-smoke:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft != true ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.head.ref != 'codex/kernel-memory-lab' ||
      github.event.pull_request.base.ref != 'main'
    name: Serving and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          # Report an exact PR head, independently of the full-suite merge run.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.serving_only && inputs.qualification_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Start bounded qualification watcher
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        env:
          KML_CI_GITHUB_TOKEN: ${{ github.token }}
          KML_CI_EXPECTED_SHA: ${{ inputs.qualification_sha }}
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --start-watch
          --expected-sha "$KML_CI_EXPECTED_SHA"
          --root "$RUNNER_TEMP/kml-ci-serving"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.serving_only }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - if: github.event_name != 'workflow_dispatch' || !inputs.serving_only
        run: uv sync --locked --extra cpu --dev
      - name: Bounded offline serving and CLI regression checks
        if: github.event_name != 'workflow_dispatch' || !inputs.serving_only
        run: |
          export SPARSELAB_WORK_DIR="$RUNNER_TEMP/serving-work"
          git rev-parse HEAD
          uv run --locked --extra cpu python --version
          uv run --locked --extra cpu pytest -vv -ra --tb=long --durations=15 \
            -o faulthandler_timeout=90 --basetemp "$RUNNER_TEMP/serving-pytest" \
            tests/test_serving.py tests/test_inference_debug.py \
            tests/test_generation_result.py tests/test_runtime_id_selection.py \
            tests/test_snapshot_inference.py tests/test_snapshot_artifact_bindings.py \
            tests/test_snapshot_authority.py
      - name: Run bounded qualification serving checks
        if: github.event_name == 'workflow_dispatch' && inputs.serving_only
        env:
          KML_CI_GITHUB_TOKEN: ${{ github.token }}
          KML_CI_EXPECTED_SHA: ${{ inputs.qualification_sha }}
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --job serving
          --expected-sha "$KML_CI_EXPECTED_SHA"
          --root "$RUNNER_TEMP/kml-ci-serving"
      - name: Finalize qualification watcher
        if: always() && github.event_name == 'workflow_dispatch' && inputs.serving_only
        run: >-
          python3 tools/kernel-memory-lab/ci-guard/run_job.py --stop-watch
          --root "$RUNNER_TEMP/kml-ci-serving"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.serving_only
        with:
          name: kml-ci-serving-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kml-ci-serving/*.json
            ${{ runner.temp }}/kml-ci-serving/*.log
            ${{ runner.temp }}/kml-ci-serving/*.sqlite*
            ${{ runner.temp }}/kml-ci-serving/events/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain CLI startup diagnostics in the job log
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/serving-pytest" ]; then
            find "$RUNNER_TEMP/serving-pytest" -type f \
              \( -name 'serve.stdout.log' -o -name 'serve.stderr.log' \) \
              -print -exec tail -c 16384 {} \;
          fi
  test:
    # Long native integrations are manual-only; serving-only dispatch skips them.
    if: github.event_name == 'workflow_dispatch' && !inputs.serving_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Full CPU suite (Linux)
        run: >-
          uv run --locked --extra cpu pytest -q -n auto --maxprocesses=4
          --dist worksteal --durations=25
          -m "not mps and not mlx and not cuda and not rocm and not xpu and not network"
      - run: uv run --locked --extra cpu sparselab --help
      - run: uv run --locked --extra cpu sparselab inspect configs/micro_dense.yaml --json
  test-macos-arm64:
    if: github.event_name == 'workflow_dispatch' && !inputs.serving_only
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Full CPU suite (macOS)
        run: >-
          uv run --locked --extra cpu pytest -q -n auto --maxprocesses=4
          --dist worksteal --durations=25
          -m "not mps and not mlx and not cuda and not rocm and not xpu and not network"
      - run: uv run --locked --extra cpu sparselab --help
      - run: uv run --locked --extra cpu sparselab inspect configs/micro_dense.yaml --json
