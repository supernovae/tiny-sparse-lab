name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR updates replace obsolete work; main remains covered after merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Tiny CPU fixtures benefit from parallel pytest workers, not nested BLAS pools.
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  # Pin supported images: Linux x64 and macOS arm64 CPU coverage.
  # https://github.com/actions/runner-images#available-images
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: check .
      - name: Verify frozen decoding test identity
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          frozen = json.loads(Path("experiments/research/dense-lm-decoding-v1/preregistration.json").read_text())
          test = Path("tests/test_generation.py")
          expected = frozen["frozen_sha256"][test.as_posix()]
          actual = hashlib.sha256(test.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"{test}: frozen preregistration digest changed")
          PY
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: format --check .
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Lint tracked research declarations and evidence references
        run: uv run --locked --extra cpu python -m sparselab.research.lint --json
      - name: Focused configuration, corpus, and ingestion checks
        run: >-
          uv run --locked --extra cpu pytest -q
          tests/test_research_lint.py
          tests/test_corpus_identity.py
          tests/test_config.py
          tests/test_conversations.py
          tests/test_corpus_acquisition.py
          tests/test_corpus_pipeline.py
          tests/test_hf_auth.py
  evidence-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Offline research lint and corpus archive acceptance (macOS)
        run: |
          uv run --locked --extra cpu python -m sparselab.research.lint --json
          uv run --locked --extra cpu pytest -q \
            tests/test_research_lint.py tests/test_declaration_preflight.py \
            tests/test_corpus_pipeline.py tests/test_corpus_identity.py tests/test_archive.py
  serving-smoke:
    name: Serving and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          # Report an exact PR head, independently of the full-suite merge run.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Bounded offline serving and CLI regression checks
        run: |
          export SPARSELAB_WORK_DIR="$RUNNER_TEMP/serving-work"
          git rev-parse HEAD
          uv run --locked --extra cpu python --version
          uv run --locked --extra cpu pytest -vv -ra --tb=long --durations=15 \
            -o faulthandler_timeout=90 --basetemp "$RUNNER_TEMP/serving-pytest" \
            tests/test_serving.py tests/test_inference_debug.py \
            tests/test_generation_result.py tests/test_runtime_id_selection.py
      - name: Retain CLI startup diagnostics in the job log
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/serving-pytest" ]; then
            find "$RUNNER_TEMP/serving-pytest" -type f \
              \( -name 'serve.stdout.log' -o -name 'serve.stderr.log' \) \
              -print -exec tail -c 16384 {} \;
          fi
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Full CPU suite (Linux)
        run: >-
          uv run --locked --extra cpu pytest -q -n auto --maxprocesses=4
          --dist worksteal --durations=25
          -m "not mps and not mlx and not cuda and not rocm and not xpu and not network"
      - run: uv run --locked --extra cpu sparselab --help
      - run: uv run --locked --extra cpu sparselab inspect configs/micro_dense.yaml --json
  test-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Full CPU suite (macOS)
        run: >-
          uv run --locked --extra cpu pytest -q -n auto --maxprocesses=4
          --dist worksteal --durations=25
          -m "not mps and not mlx and not cuda and not rocm and not xpu and not network"
      - run: uv run --locked --extra cpu sparselab --help
      - run: uv run --locked --extra cpu sparselab inspect configs/micro_dense.yaml --json
