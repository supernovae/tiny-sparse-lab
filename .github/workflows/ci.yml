name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: "Manual scope; model suites require a separate reviewed allocation"
        type: choice
        options: [safe, fast, integration-linux, platform-macos, release-candidate]
        default: safe

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  CUDA_VISIBLE_DEVICES: ""
  HIP_VISIBLE_DEVICES: ""
  ROCR_VISIBLE_DEVICES: ""
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  safe:
    # The same small zero-model suite runs for every PR, draft or ready, and main.
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'safe'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Static format and research records
        env:
          UV_OFFLINE: "1"
        run: |
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync ruff format --check .
          uv run --locked --no-sync python -m sparselab.research.lint --json
      - name: Explicit zero-model-work regressions
        env:
          UV_OFFLINE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SPARSELAB_WORK_DIR: ${{ runner.temp }}/pr-safe-work
        run: |
          uv run --locked --no-sync pytest -q -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/pr-safe-pytest" \
            tests/test_research_lint.py::test_actual_tracked_research_records \
            tests/test_research_lint.py::test_exact_pinned_legacy_records_are_retained \
            tests/test_research_lint.py::test_changed_legacy_bytes_are_rejected \
            tests/test_research_lint.py::test_same_legacy_bytes_at_different_path_are_rejected \
            tests/test_research_lint.py::test_additional_unapproved_legacy_artifact_is_rejected \
            tests/test_preparation_commands.py \
            tests/test_verification_adapters.py \
            tests/test_spot_safety.py \
            tests/test_snapshot_warm_reuse.py \
            tests/test_snapshot_inheritance.py \
            tests/test_corpus_acquisition.py::test_bounded_resource_readings_exact_expansion_cap \
            tests/test_corpus_acquisition.py::test_bounded_overlong_line_retains_measured_prefix \
            tests/test_corpus_acquisition.py::test_required_staging_reading_failure_is_closed \
            tests/test_corpus_acquisition.py::test_parquet_required_expansion_reading_is_unavailable \
            tests/test_corpus_acquisition.py::test_staging_counters_include_empty_interrupted_input \
            tests/test_corpus_acquisition.py::test_wikimedia_interruption_retains_distinct_resource_receipts \
            tests/test_corpus_acquisition.py::test_wikimedia_resource_journal_rejects_symlink \
            tests/test_corpus_acquisition.py::test_hf_without_transport_ledger_retains_interrupted_shard \
            tests/test_attempt_contract.py::test_zero_update_vector_reservations_persist_without_refund \
            tests/test_operational_monitor_safety.py::test_absent_optional_fields_preserve_legacy_policy_and_receipt_serialization \
            tests/test_corpus_mixture.py::test_native_packing_supervises_exact_exported_quota \
            tests/test_panel_decoder_controls.py::test_absent_controls_preserve_legacy_declaration_and_hash \
            tests/test_reviewed_score_readiness.py::test_renderer_and_exact_frozen_question_prompt_binding \
            tests/test_reviewed_score_readiness.py::test_threshold_failure_and_missing_scores_cannot_promote \
            tests/test_attempt_native_integration_optin.py::test_ordinary_pytest_skips_optimizer_node_before_setup \
            tests/test_ci_routing.py::test_ordinary_ci_selects_only_explicit_zero_model_nodes

  lab-loop:
    # Lab-mode loop-time guard (CPU only): tokenizer -> try (with the fast probe
    # tier) -> report on a tiny synthetic delta must finish well inside the
    # 15-minute target; the probe battery, explorer and lab-dashboard tests ride
    # along.
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'safe'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Timed lab loop (tokenizer -> try + probe -> report, references)
        env:
          UV_OFFLINE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SPARSELAB_WORK_DIR: ${{ runner.temp }}/lab-loop-work
          SPARSELAB_LAB_LOOP_BUDGET_SECONDS: "900"
        run: |
          uv run --locked --no-sync pytest -q -s -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/lab-loop-pytest" \
            tests/test_lab_mode.py::test_cpu_smoke_loop_yaml_to_report_within_budget \
            tests/test_probes.py \
            tests/test_references.py \
            tests/test_probe_followups.py \
            tests/test_explorer.py \
            tests/test_dashboard_lab.py

  fast:
    # Every PR and main push, plus manual dispatch: the whole suite except tests
    # marked slow (tests/slow_tests.txt). Slow tests run in the nightly workflow
    # (.github/workflows/nightly.yml), which reports failures as an issue.
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Fast CPU suite (not slow)
        env:
          UV_OFFLINE: "1"
          SPARSELAB_WORK_DIR: ${{ runner.temp }}/fast-work
        run: >-
          uv run --locked --no-sync pytest -q -p no:cacheprovider
          --basetemp "$RUNNER_TEMP/fast-pytest"
          -n auto --maxprocesses=4
          --dist loadfile --durations=25
          -m "not slow and not mps and not mlx and not cuda and not rocm and not xpu and not network"

  integration-linux:
    # Model work is manual-only. Dispatch requires its own reviewed allocation.
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'integration-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Manual optimizer and generation integration
        run: >-
          uv run --locked --extra cpu pytest -q
          tests/test_training.py tests/test_generation.py
          tests/test_generation_panel.py tests/test_serving.py

  platform-macos:
    # Platform model behavior is not inferred from the Linux PR checks.
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'platform-macos'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Manual macOS optimizer and generation integration
        run: >-
          uv run --locked --extra cpu pytest -q
          tests/test_training.py tests/test_generation.py
          tests/test_generation_panel.py tests/test_serving.py

  release-candidate:
    # Broad suites are available only through explicit manual selection.
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'release-candidate'
    name: Full CPU suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Manual release-candidate CPU suite
        run: >-
          uv run --locked --extra cpu pytest -q -n auto --maxprocesses=4
          --dist worksteal --durations=25
          -m "not mps and not mlx and not cuda and not rocm and not xpu and not network"
      - run: uv run --locked --extra cpu sparselab --help
      - run: uv run --locked --extra cpu sparselab inspect configs/micro_dense.yaml --json
