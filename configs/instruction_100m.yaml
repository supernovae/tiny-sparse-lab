schema_version: 2
name: instruction-100m-reference
seed: 42
model:
  vocab_size: 8192
  hidden_dim: 896
  num_layers: 10
  num_heads: 8
  ffn_dim: 2432
  max_seq_len: 256
tokenizer:
  path: ../artifacts/tokenizer_instruction_8k/tokenizer.json
dataset:
  source: instruction_reference
  cache_dir: ../artifacts/data
  train_max_documents: 800000
  validation_max_documents: 10000
  train_max_tokens: 20000000
  validation_max_tokens: 262144
  synthetic_seed: 42
training:
  seq_len: 128
  max_steps: 10000
  max_tokens: 20000000
  deterministic: true
  micro_batch_size: 4
  gradient_accumulation: 4
optimizer:
  name: adamw
  peak: 0.0003
  floor: 3.0e-05
  warmup_steps: 500
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-08
  state_offload: false
evaluation:
  every_steps: 500
  max_batches: 32
logging:
  root_dir: ../runs
  every_steps: 10
runtime:
  engine: pytorch
  backend: auto
  device_index: 0
  precision: fp32
  memory:
    policy: balanced
    max_device_memory_fraction: 0.9
    budget_bytes: null
    activation_checkpointing:
      enabled: true
      strategy: transformer_block
    activation_offload:
      enabled: false
    allowed_sequence_lengths: []
    allowed_optimizers: []
checkpoint:
  every_steps: 500
  every_tokens: null
  every_minutes: null
  keep_periodic: true
staging:
  smoke_steps: 2
  warmup_steps: 5
