schema_version: 2
name: dense-lm-scale-v1
seed: 17
model:
  vocab_size: 8192
  hidden_dim: 704
  num_layers: 10
  num_heads: 8
  ffn_dim: 1168
  max_seq_len: 256
tokenizer:
  path: ../artifacts/tokenizer_dense_lm_v1/tokenizer.json
dataset:
  source: tinystories
  revision: f54c09fd23315a6f9c86f9dc80f725de7d8f9c64
  cache_dir: ../artifacts/data
  train_max_documents: 20000
  validation_max_documents: 500
  train_max_tokens: 5000000
  validation_max_tokens: 65536
training:
  seq_len: 128
  max_steps: 16384
  max_tokens: 16777216
  micro_batch_size: 8
  gradient_accumulation: 1
  grad_clip_norm: 1.0
  deterministic: true
optimizer:
  name: adamw
  peak: 0.0003
  floor: 3.0e-05
  warmup_steps: 10
  decay_steps: 4096
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  state_offload: false
runtime:
  engine: pytorch
  backend: rocm
  device_index: 0
  precision: fp32
  memory:
    policy: balanced
    max_device_memory_fraction: 0.9
    budget_bytes: null
    activation_checkpointing:
      enabled: false
      strategy: transformer_block
    activation_offload:
      enabled: false
    allowed_sequence_lengths: []
    allowed_optimizers: []
checkpoint:
  every_steps: null
  every_tokens: null
  every_minutes: null
  steps: [0, 200, 400, 1024, 2048, 3072, 4096, 8192, 16384]
  keep_periodic: true
evaluation:
  every_steps: 200
  max_batches: 64
logging:
  root_dir: ../sparselab-work/experiments/dense-lm-scale-v1/runs
  every_steps: 1
  architecture_diagnostics: scalar
staging:
  smoke_steps: 2
  warmup_steps: 5
