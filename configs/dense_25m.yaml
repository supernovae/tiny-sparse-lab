schema_version: 2
name: dense-25m
seed: 42
model:
  vocab_size: 8192
  hidden_dim: 512
  num_layers: 8
  num_heads: 8
  ffn_dim: 1408
  max_seq_len: 256
tokenizer:
  path: ../artifacts/tokenizer_8k/tokenizer.json
dataset:
  source: tinystories
  revision: f54c09fd23315a6f9c86f9dc80f725de7d8f9c64
  cache_dir: ../artifacts/data
  train_max_documents: 20000
  validation_max_documents: 500
  train_max_tokens: 2000000
  validation_max_tokens: 65536
training:
  seq_len: 128
  max_steps: 200
  max_tokens: 204800
  micro_batch_size: 8
  gradient_accumulation: 1
logging:
  root_dir: ../runs
runtime:
  engine: pytorch
  backend: auto
  device_index: 0
  precision: fp32
  memory:
    policy: balanced
    max_device_memory_fraction: 0.9
    budget_bytes: null
    activation_checkpointing:
      enabled: false
      strategy: transformer_block
    activation_offload:
      enabled: false
    allowed_sequence_lengths: []
    allowed_optimizers: []
optimizer:
  name: adamw
  peak: 0.0003
  floor: 3.0e-05
  warmup_steps: 10
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  state_offload: false
checkpoint:
  every_steps: 50
  every_tokens: null
  every_minutes: null
  keep_periodic: true
staging:
  smoke_steps: 2
  warmup_steps: 5
