  memory_ngram_size: 0
  memory_dim: 0
  memory_package_path: null
  memory_ngram_orders: []
  memory_hash_heads: 1
attention:
  kind: dense
  rope_base: 10000.0
runtime:
  engine: pytorch
  backend: cpu
  device_index: 0
  precision: fp32
  memory:
    policy: balanced
    max_device_memory_fraction: 0.9
    budget_bytes: null
    activation_checkpointing:
      enabled: false
      strategy: transformer_block
    activation_offload:
      enabled: false
    allowed_sequence_lengths: []
    allowed_optimizers: []
tokenizer:
  path: ../artifacts/tokenizer_path_domain_v1/tokenizer.json
