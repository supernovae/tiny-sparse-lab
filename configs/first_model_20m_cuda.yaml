# First real model: ~20M-parameter dense decoder on a FineWeb-Edu sample.
# One consumer CUDA GPU (bf16). See docs/first-model.md for the full flow.
# CPU twin: configs/first_model_20m_cpu.yaml (same model, smaller token budget).
schema_version: 2
name: first-model-20m-cuda
seed: 42
model:
  vocab_size: 8192
  hidden_dim: 384
  num_layers: 8
  num_heads: 6
  ffn_dim: 1024
  max_seq_len: 512
tokenizer:
  # Built by configs/tokenizer_fineweb_scale_8k.yaml (same FineWeb-Edu revision).
  path: ../sparselab-work/experiments/dense-scale/tokenizer/tokenizer.json
dataset:
  source: fineweb_edu
  revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
  dataset_config: sample-10BT
  cache_dir: ../sparselab-work/experiments/dense-scale/data
  train_max_documents: 60000
  validation_max_documents: 1000
  train_max_tokens: 60000000
  validation_max_tokens: 262144
  synthetic_seed: 42
training:
  seq_len: 512
  max_steps: 6000
  max_tokens: 49152000
  deterministic: true
  micro_batch_size: 16
  gradient_accumulation: 1
  grad_clip_norm: 1.0
optimizer:
  name: adamw
  peak: 0.001
  floor: 0.0001
  warmup_steps: 200
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-08
  state_offload: false
evaluation:
  every_steps: 500
  max_batches: 32
logging:
  root_dir: ../sparselab-work/experiments/first-model/runs
  every_steps: 10
runtime:
  engine: pytorch
  backend: cuda
  device_index: 0
  precision: bf16
  memory:
    policy: balanced
    max_device_memory_fraction: 0.85
    budget_bytes: null
    activation_checkpointing:
      enabled: false
      strategy: transformer_block
    activation_offload:
      enabled: false
    allowed_sequence_lengths: []
    allowed_optimizers: []
checkpoint:
  every_steps: 1000
  every_tokens: null
  every_minutes: 20
  keep_periodic: true
staging:
  smoke_steps: 2
  warmup_steps: 8
