schema_version: 2
name: runtime-smoke-rocm
seed: 7
model:
  vocab_size: 512
  hidden_dim: 16
  num_layers: 1
  num_heads: 2
  ffn_dim: 32
  max_seq_len: 32
tokenizer:
  path: ../artifacts/tokenizer_smoke/tokenizer.json
dataset:
  source: synthetic
  cache_dir: ../artifacts/runtime_data
  train_max_documents: 100
  validation_max_documents: 100
  train_max_tokens: 129
  validation_max_tokens: 81
  synthetic_seed: 7
training:
  seq_len: 16
  micro_batch_size: 1
  gradient_accumulation: 2
  max_steps: 20
  max_tokens: 640
  grad_clip_norm: 1.0
  deterministic: true
optimizer:
  name: adamw
  peak: 0.003
  floor: 0.0003
  warmup_steps: 2
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
runtime:
  engine: pytorch
  backend: rocm
  precision: fp32
  memory:
    activation_checkpointing:
      enabled: true
      strategy: transformer_block
    activation_offload:
      enabled: false
checkpoint:
  every_steps: 10
  keep_periodic: true
evaluation:
  every_steps: 5
  max_batches: 4
logging:
  root_dir: ../runs-rocm
  every_steps: 1
  architecture_diagnostics: scalar
staging:
  smoke_steps: 2
  warmup_steps: 5
